<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sve ture</title>
    <link rel="stylesheet" href="../dist/index.css" />
    <script type="module" src="../dist/index.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="logo">Logo</div>
      <div class="slogan">Neki slogan</div>
      <div class="user-profile"></div>
    </header>

    <nav class="navbar">
      <ul class="nav-list">
        <li class="nav-item" id="logout">
          <a href="../../../users/pages/login/login.html">Logout</a>
        </li>
      </ul>
    </nav>

    <div class="layout">
      <aside class="sidebar left">
        <h2>Filteri</h2>
        <li class="nav-item">
          <a href="../app/tours/pages/my-reservations/my-reservations.html"
            >Moje rezervacije</a
          >
        </li>
        <div class="controls">
          <label for="pageSize">Prikaži po:</label>
          <select id="pageSize">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
      </aside>

      <div class="center">
        <h1>Pregled svih tura</h1>
        <table id="toursTable">
          <thead>
            <tr>
              <th class="sortable" data-column="Name">Naziv ▲▼</th>
              <th class="sortable" data-column="DateTime">Datum ▲▼</th>
              <th class="sortable" data-column="MaxGuests">
                Maks. učesnika ▲▼
              </th>
              <th>Opis</th>
              <th>Slobodna mesta</th>
              <th>Detalji</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <aside class="sidebar right">Mesto za reklame</aside>
      <div class="pagination">
        <button id="prevPage">Prethodna</button>
        <span id="pageInfo"></span>
        <button id="nextPage">Naredna</button>
      </div>
    </div>
  </body>
</html>
